<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar venta | Vital Dog Cat</title>
  </head>
  <body>
    <!-- Encabezado del prototipo -->
    <header id="encabezado" class="encabezado">
      <p>Vital Dog Cat Inventory</p>
      <nav aria-label="Menú del sistema">
        <ul>
          <li><a href="admin.html">INICIO</a></li>
          <li><a href="inventario.html">INVENTARIO</a></li>
          <li><a href="usuarios.html">USUARIOS</a></li>
          <li><a href="login.html">Cerrar sesion</a></li>
          <li><a href="index.html">SALIR</a></li>
        </ul>
      </nav>
    </header>
    <!-- Contenido de la pantalla -->
    <main id="contenido" class="contenido">
      <h1>REGISTRAR VENTA</h1>
      <form id="registro-venta" class="formulario" action="#registro-venta" method="post">
        <fieldset>
          <legend>Datos de la venta</legend>
          <p>
            <label for="cliente">Nombre del cliente</label>
            <input type="text" id="cliente" name="cliente" placeholder="Nombre del cliente" maxlength="100" required>
          </p>
          <p>
            <label for="producto">Seleccione el producto</label>
            <select id="producto" name="producto" required>
              <option value="">Seleccione el producto</option>
              <option value="demostracion">Producto de demostración</option>
            </select>
          </p>
          <p>
            <label for="cantidad">Cantidad</label>
            <input type="number" id="cantidad" name="cantidad" min="1" step="1" required>
          </p>
          <p>
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha" required>
          </p>
        </fieldset>
        <p><button type="submit">REGISTRAR VENTA</button></p>
      </form>
      <p><a href="admin.html" aria-label="Volver al inicio del sistema">Volver</a></p>
    </main>
    <!-- Pie de página -->
    <footer class="pie-pagina">
      <p><small>&copy; 2026 – Vital Dog Cat</small></p>
    </footer>
  </body>
</html>
