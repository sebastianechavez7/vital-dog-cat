<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar venta | Vital Dog Cat</title>
  </head>
  <body>
    <!-- Encabezado y navegación principal -->
    <header id="encabezado" class="encabezado">
      <a href="index.html"><img src="img/logo.svg" alt="Vital Dog Cat: volver al inicio" width="240" height="60"></a>
      <nav aria-label="Navegación principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="login.html">Inicio de sesión</a></li>
          <li><a href="registro.html">Registro</a></li>
          <li><a href="admin.html">Panel principal</a></li>
          <li><a href="inventario.html">Inventario</a></li>
          <li><a href="usuarios.html">Usuarios</a></li>
          <li><a href="proveedores.html">Proveedores</a></li>
          <li><a href="contacto.html">Contacto</a></li>
          <li><a href="multimedia.html">Multimedia</a></li>
        </ul>
      </nav>
    </header>
    <!-- Contenido principal -->
    <main id="contenido" class="contenido">
      <h1>REGISTRAR VENTA</h1>
      <section id="venta" class="seccion-formulario">
        <h2>Datos de venta</h2>
        <p>Maqueta de práctica: este formulario todavía no guarda datos. Use datos ficticios.</p>
        <form action="#venta" method="post">
          <fieldset>
            <legend>Datos de venta</legend>
            <p>
              <label for="fecha">Fecha</label>
              <input type="date" id="fecha" name="fecha" required>
            </p>
            <p>
              <label for="producto">Producto</label>
              <select id="producto" name="producto" required>
                <option value="">Seleccione una opción</option>
                <option value="demostracion">Producto de demostración</option>
              </select>
            </p>
            <p>
              <label for="cantidad">Cantidad</label>
              <input type="number" id="cantidad" name="cantidad" min="1" step="1" required>
            </p>
            <p>
              <label for="precio">Precio unitario</label>
              <input type="number" id="precio" name="precio" min="0" step="0.01" required>
            </p>
          </fieldset>
          <p>
            <button type="submit">Registrar venta</button>
            <button type="reset">Limpiar</button>
          </p>
        </form>
      </section>
      <p><a href="admin.html">VOLVER</a></p>
    </main>
    <!-- Pie de página -->
    <footer class="pie-pagina">
      <p><small>&copy; 2026 – Vital Dog Cat</small></p>
    </footer>
  </body>
</html>
