<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar producto | Vital Dog Cat</title>
  </head>
  <body>
    <!-- Encabezado del prototipo -->
    <header id="encabezado" class="encabezado">
      <p>Vital Dog Cat Inventory</p>
      <nav aria-label="Menú del sistema">
        <ul>
          <li><a href="admin.html">INICIO</a></li>
          <li><a href="inventario.html">INVENTARIO</a></li>
          <li><a href="usuarios.html">USUARIOS</a></li>
          <li><a href="login.html">Cerrar sesion</a></li>
          <li><a href="index.html">SALIR</a></li>
        </ul>
      </nav>
    </header>
    <!-- Contenido de la pantalla -->
    <main id="contenido" class="contenido">
      <h1>REGISTRAR PRODUCTO</h1>
      <form id="registro-producto" class="formulario" action="#registro-producto" method="post">
        <fieldset>
          <legend>Datos del producto</legend>
          <p>
            <label for="nombre">Nombre del producto</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre del producto" maxlength="100" required>
          </p>
          <p>
            <label for="precio">Precio unitario</label>
            <input type="number" id="precio" name="precio" placeholder="Precio unitario" min="0" step="0.01" required>
          </p>
          <p>
            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria" required>
              <option value="">Categoria</option>
              <option value="alimentos">Alimentos</option>
              <option value="medicamentos">Medicamentos</option>
              <option value="accesorios">Accesorios</option>
            </select>
          </p>
          <p>
            <label for="cantidad">Cantidad en stock</label>
            <input type="number" id="cantidad" name="cantidad" min="0" step="1" required>
          </p>
          <p>
            <label for="vencimiento">Fecha de vencimiento</label>
            <input type="date" id="vencimiento" name="vencimiento" required>
          </p>
        </fieldset>
        <p><button type="submit">REGISTRAR PRODUCTO</button></p>
      </form>
      <p><a href="admin.html" aria-label="Volver al inicio del sistema">Volver</a></p>
    </main>
    <!-- Pie de página -->
    <footer class="pie-pagina">
      <p><small>&copy; 2026 – Vital Dog Cat</small></p>
    </footer>
  </body>
</html>
