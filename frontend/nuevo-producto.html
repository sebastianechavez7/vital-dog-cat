<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar producto | Vital Dog Cat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&amp;display=swap">
    <link rel="stylesheet" href="css/estilos.css">
  </head>
  <body class="pagina pagina-sistema pagina-producto">
    <!-- Encabezado del prototipo -->
    <header id="encabezado" class="encabezado">
      <p>Vital Dog Cat Inventory</p>
    </header>
    <!-- Barra lateral del sistema -->
    <nav class="menu-lateral" aria-label="Menú del sistema">
      <ul class="menu">
        <li><a href="admin.html"><span class="icono-menu" aria-hidden="true"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M3 15 16 3 29 15 26 18 24 16v13h-6v-9h-4v9H8V16l-2 2Z"/></svg></span><span>INICIO</span></a></li>
        <li><a href="inventario.html"><span class="icono-menu" aria-hidden="true"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M3 7h26v22H3Z"/><path class="trazo-icono" d="M2 7 7 3h18l5 4M16 7v22"/></svg></span><span>INVENTARIO</span></a></li>
        <li><a href="usuarios.html"><span class="icono-menu" aria-hidden="true"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle cx="7" cy="10" r="5"/><circle cx="25" cy="10" r="5"/><path d="M0 27V22q0-7 7-7t7 7v5M18 27V22q0-7 7-7t7 7v5"/><circle cx="16" cy="13" r="6"/><path d="M7 31v-5q0-8 9-8t9 8v5Z"/></svg></span><span>USUARIOS</span></a></li>
        <li><a href="login.html"><span class="icono-menu" aria-hidden="true">⏻</span><span>Cerrar sesion</span></a></li>
        <li><a href="index.html"><span class="icono-menu" aria-hidden="true">⏻</span><span>SALIR</span></a></li>
      </ul>
    </nav>
    <!-- Contenido de la pantalla -->
    <main id="contenido" class="contenido">
      <h1>REGISTRAR PRODUCTO</h1>
      <form id="registro-producto" class="formulario" action="#registro-producto" method="post">
        <fieldset>
          <legend>Datos del producto</legend>
          <p>
            <label for="nombre">Nombre del producto</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre del producto" maxlength="100" required>
          </p>
          <p>
            <label for="precio">Precio unitario</label>
            <input type="number" id="precio" name="precio" placeholder="Precio unitario" min="0" step="0.01" required>
          </p>
          <p>
            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria" required>
              <option value="">Categoria</option>
              <option value="alimentos">Alimentos</option>
              <option value="medicamentos">Medicamentos</option>
              <option value="accesorios">Accesorios</option>
            </select>
          </p>
          <p>
            <label for="cantidad">Cantidad en stock</label>
            <input type="number" id="cantidad" name="cantidad" min="0" step="1" required>
          </p>
          <p>
            <label for="vencimiento">Fecha de vencimiento</label>
            <input type="date" id="vencimiento" name="vencimiento" required>
          </p>
        </fieldset>
        <p><button class="boton" type="submit">REGISTRAR PRODUCTO</button></p>
      </form>
      <p><a href="admin.html" class="boton-volver" aria-label="Volver al inicio del sistema">↶</a></p>
    </main>
    <!-- Pie de página -->
    <footer class="pie-pagina">
      <p><small>&copy; 2026 – Vital Dog Cat</small></p>
    </footer>
  </body>
</html>
