<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión | Vital Dog Cat</title>
  </head>
  <body>
    <!-- Identidad de la veterinaria -->
    <header id="encabezado" class="encabezado">
      <a href="index.html"><img src="img/logo.svg" alt="Logo original de Vital Dog Cat Veterinaria: volver al inicio" width="360" height="166"></a>
      <nav aria-label="Navegación de acceso">
        <ul>
          <li><a href="index.html">Volver al inicio</a></li>
        </ul>
      </nav>
    </header>
    <!-- Inicio de sesión -->
    <main id="contenido" class="contenido">
      <section id="inicio-sesion" class="seccion-formulario">
        <h1>Inicio de sesión</h1>
        <form action="#inicio-sesion" method="post">
          <fieldset>
            <legend>Datos de acceso</legend>
            <p>
              <label for="usuario">Usuario</label>
              <input type="text" id="usuario" name="usuario" placeholder="admin1" autocomplete="username" required>
            </p>
            <p>
              <label for="contrasenia">Contraseña</label>
              <input type="password" id="contrasenia" name="contrasenia" autocomplete="current-password" required>
            </p>
          </fieldset>
          <p><button type="submit">Iniciar</button></p>
        </form>
      </section>
    </main>
    <!-- Pie de página -->
    <footer class="pie-pagina">
      <p><small>&copy; 2026 – Vital Dog Cat</small></p>
    </footer>
  </body>
</html>
